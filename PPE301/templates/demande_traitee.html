{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande Traitée - IWAMMO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'fonts/icomoon/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/tiny-slider.css' %}" />
    <link rel="stylesheet" href="{% static 'css/aos.css' %}" />
    
    <style>
        /* Définition des variables de couleur de votre projet pour cette page */
        :root {
            --primary-color: #005555;
            --secondary-color: #00204a;
            --text-dark: #343a40;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
        }
        
        /* Styles de la carte de confirmation */
        .confirmation-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
            padding: 3rem;
            background-color: #ffffff;
            animation: fadeIn 1s ease-in-out;
        }
        
        .confirmation-icon {
            font-size: 5rem;
            color: var(--primary-color); /* Utilisation de la couleur principale */
            margin-bottom: 1.5rem;
        }
        
        .confirmation-heading {
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }
        
        .confirmation-text {
            color: var(--text-dark);
            line-height: 1.6;
            font-size: 1.1rem;
        }

        /* Bouton personnalisé */
        .btn-custom {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
            font-weight: 600;
            padding: 1rem 2.5rem;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
            text-decoration: none;
        }

        .btn-custom:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            color: #fff;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <nav class="site-nav">
        <div class="container">
            <div class="menu-bg-wrap">
                <div class="site-navigation">
                    <a href="{% url 'home' %}" class="logo m-0 float-start">IWAMMO</a>
                    <ul class="js-clone-nav d-none d-lg-inline-block text-start site-menu float-end">
                        <li><a href="{% url 'home' %}">Accueil</a></li>
                        <li><a href="{% url 'property' %}">Propriétés</a></li>
                        <li><a href="{% url 'contact' %}">Contact</a></li>
                    </ul>
                    <a href="#" class="burger light me-auto float-end mt-1 site-menu-toggle js-menu-toggle d-inline-block d-lg-none" data-toggle="collapse" data-target="#main-navbar">
                        <span></span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card confirmation-card">
                        <i class="icon-check_circle confirmation-icon"></i>
                        <h1 class="confirmation-heading">Demande traitée avec succès !</h1>
                        <p class="confirmation-text">
                            La demande a été mise à jour et traitée. Merci d'avoir effectué la demande.
                        </p>
                        <a href="{% url 'home' %}" class="btn btn-custom mt-4">
                            Retour à l'accueil
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="site-footer">
        </div>

    <script src="{% static 'js/bootstrap.bundle.min.js'%}"></script>
    <script src="{% static 'js/tiny-slider.js'%}"></script>
    <script src="{% static 'js/aos.js' %}"></script>
    <script src="{% static 'js/navbar.js' %}"></script>
    <script src="{% static 'js/counter.js' %}"></script>
    <script src="{% static 'js/custom.js' %}"></script>

</body>
</html>
